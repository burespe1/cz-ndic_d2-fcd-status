cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro poskytování stavových informací o dopravě získaných z plovoucích vozidel (FCD) na sadě předem definovaných úseků silniční sítě: dojezdových dob a rychlostí dopravního proudu včetně hodnot při volném provozu, stavu a stupně provozu a odhadu délky a polohy kolon. Rychlosti se uvádějí pro všechna vozidla a odděleně pro osobní a nákladní automobily, dojezdové doby, stav provozu, stupeň provozu a kolony pro všechna vozidla; u hodnot je uvedena kvalita a počet vozidel vzorku. Úseky se identifikují odkazem na sadu poloh formátu cz-ndic_d2-pls. Formát vychází z publikace ElaboratedDataPublication modelu DATEX II 3.7; stupně provozu a kolony doplňuje rozšíření NDIC.'
  keywords: DATEX II, NDIC, ElaboratedDataPublication
en:
  perex: 'This document describes the data format used to provide traffic status information obtained from floating car data (FCD) on a set of predefined road network sections: travel times and traffic speeds including free-flow values, traffic status and level, and the estimated length and position of queues. Speeds are given for all vehicles and separately for cars and lorries; travel times, traffic status, level and queues for all vehicles; values carry their quality and the number of vehicles in the sample. Sections are identified by a reference to the location set of the format cz-ndic_d2-pls. The format is based on the ElaboratedDataPublication of the DATEX II 3.7 model; traffic levels and queues are added by the NDIC extension.'
  keywords: DATEX II, NDIC, ElaboratedDataPublication

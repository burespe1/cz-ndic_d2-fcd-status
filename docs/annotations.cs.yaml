# Ruční texty k tabulkám elementů – jediný ručně psaný vstup tabulek.
# Klíč = název třídy ve schématu (např. SituationRecord), pod ním element:
#
# SituationRecord:
#   _: Úvodní věta tabulky (nepovinné).
#   probabilityOfOccurrence:
#     note: Popis z pohledu NDIC.
#     card: "1..1"      # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true    # NDIC vždy vyplňuje
#     values:           # překlad/upřesnění hodnot výčtu jen pro tento element
#       certain: jistě nastalo
#   locationReference:
#     variants: reduced # u elementu s více typy: výčet typů je zúžený profilem (popisek „zúžený výčet – N“);
#                       # seznam názvů tříd ([A, B]) uvede jen tyto typy
#
# _enum:                # překlady hodnot výčtů pro celý formát (přepisují sdílený slovník kitu)
#   ProbabilityEnum.certain: jistá
# _unused_types: [LinearLocation]   # třídy, které schéma připouští, ale formát nepoužívá (ve výčtech variant se neuvádějí)

TrafficStatus:
  _trafficStatusExtension: >-
    Rozšiřující bod; ve formátu nese rozšíření NDIC <<el-NdicFcdExtension,`ndic:NdicFcdExtension`>>
    (stupeň provozu a kolony), jen pro všechna vozidla – viz <<rozsireni,Struktura rozšíření NDIC>>.
NdicFcdExtension:
  _: Rozšíření NDIC stavu provozu na segmentu – stupeň provozu podle zvyklostí v ČR a kolony. Platí pro všechna vozidla.
  trafficLevel: Stupeň provozu na segmentu podle národní klasifikace.
  queueInformation: Kolony zjištěné na segmentu.
TrafficLevel:
  _: Stupeň provozu podle národní klasifikace, odvozený z poměru aktuální rychlosti a rychlosti volného provozu na segmentu.
  trafficLevelValue:
    note: Stupeň provozu (`level1` až `level5`).
    values:
      level1: jednotlivá vozidla, volný provoz (poměr rychlostí 85–100 %)
      level2: skupiny vozidel, volný provoz (75–85 %)
      level3: proudy vozidel, plynulý provoz, rychlost pod povolenou (50–75 %)
      level4: tvorba kolon, nestabilní provoz, výrazně snížená rychlost (20–50 %)
      level5: dopravní kolaps, vozidla stojí nebo se pomalu posouvají v kolonách (0–20 %)
QueueInformation:
  _: Kolony na segmentu.
  queue: Kolona na segmentu; v praxi jedna.
Queue:
  _: Kolona na segmentu – délka a poloha vůči počátku segmentu ve směru provozu.
  queueLength: Celková délka kongescí na segmentu v metrech; může se lišit od délky mezi `fromPoint` a `toPoint` (na segmentu může být více kongescí).
  fromPoint: Konec kolony (místo, kam vozidla přijíždějí) jako vzdálenost od počátku segmentu ve směru jízdy v procentech jeho délky (0–100).
  toPoint: Čelo kolony jako vzdálenost od počátku segmentu ve směru jízdy v procentech jeho délky (0–100).
